name: Sync GMOogway daily lists

on:
  schedule:
    - cron: "35 23 * * *"
  workflow_dispatch:
  push:
    branches:
      - release/v3.1.1
    paths:
      - .github/workflows/derive-gmoogway-proxy-list-ai.yml
      - LOWERTOP-Enterprise-v3.1/scripts/derive_stash_rule_sets.py
      - LOWERTOP-Enterprise-v3.1/modules/stash/gmoogway-daily-lite.stoverride

concurrency:
  group: gmoogway-daily-lists
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET_BRANCH: release/v3.1.1
  UPSTREAM_REPOSITORY: GMOogway/shadowrocket-rules
  BASE_REPOSITORY: Repcz/Tool
  BASE_BRANCH: X

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Fetch, delta-optimize and validate rules
        run: |
          set -euo pipefail
          MODULE_OUTDIR="LOWERTOP-Enterprise-v3.1/modules/derived"
          STASH_OUTDIR="LOWERTOP-Enterprise-v3.1/rules/stash"
          LITE_OVERRIDE="LOWERTOP-Enterprise-v3.1/modules/stash/gmoogway-daily-lite.stoverride"
          mkdir -p "$MODULE_OUTDIR" "$STASH_OUTDIR"

          SOURCE_SHA="$(git ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" refs/heads/master | awk '{print $1}')"
          BASE_SHA="$(git ls-remote "https://github.com/${BASE_REPOSITORY}.git" "refs/heads/${BASE_BRANCH}" | awk '{print $1}')"
          test "${#SOURCE_SHA}" -eq 40
          test "${#BASE_SHA}" -eq 40

          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT

          for list in reject direct proxy; do
            curl --retry 3 --retry-all-errors -fsSL \
              "https://raw.githubusercontent.com/${UPSTREAM_REPOSITORY}/${SOURCE_SHA}/sr_${list}_list.module" \
              -o "$TMPDIR/${list}.module"
            test -s "$TMPDIR/${list}.module"
            grep -q "^#!name=${list}_list$" "$TMPDIR/${list}.module"
            grep -q '^\[Rule\]$' "$TMPDIR/${list}.module"
          done

          BASE_NAMES=(
            Direct Lan Reject AppleServers Microsoft Github Google Telegram Twitter Facebook
            Steam Epic AI Emby Spotify Bahamut Netflix Disney PrimeVideo HBO TikTok Proxy
          )
          test "${#BASE_NAMES[@]}" -eq 22
          BASE_ARGS=()
          for name in "${BASE_NAMES[@]}"; do
            file="$TMPDIR/base-${name}.list"
            curl --retry 3 --retry-all-errors -fsSL \
              "https://raw.githubusercontent.com/${BASE_REPOSITORY}/${BASE_SHA}/Stash/Rules/${name}.list" \
              -o "$file"
            test -s "$file"
            BASE_ARGS+=(--base-rule "$file")
          done

          REJECT_RULES="$(grep -Ec '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|IP-CIDR|IP-CIDR6|GEOIP|USER-AGENT|URL-REGEX),' "$TMPDIR/reject.module")"
          DIRECT_RULES="$(grep -Ec '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|IP-CIDR|IP-CIDR6|GEOIP|USER-AGENT|URL-REGEX),' "$TMPDIR/direct.module")"
          PROXY_RULES="$(grep -Ec '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|IP-CIDR|IP-CIDR6|GEOIP|USER-AGENT|URL-REGEX),' "$TMPDIR/proxy.module")"
          test "$REJECT_RULES" -gt 100000
          test "$DIRECT_RULES" -gt 100000
          test "$PROXY_RULES" -gt 20000

          cp "$TMPDIR/reject.module" "$MODULE_OUTDIR/gmoogway-reject-list-daily.module"
          cp "$TMPDIR/direct.module" "$MODULE_OUTDIR/gmoogway-direct-list-daily.module"
          python LOWERTOP-Enterprise-v3.1/scripts/derive_proxy_module.py \
            --input "$TMPDIR/proxy.module" \
            --output "$MODULE_OUTDIR/gmoogway-proxy-list-ai.module" \
            --source-commit "$SOURCE_SHA"

          python LOWERTOP-Enterprise-v3.1/scripts/derive_stash_rule_sets.py \
            --source-commit "$SOURCE_SHA" \
            --base-commit "$BASE_SHA" \
            "${BASE_ARGS[@]}" \
            --output-dir "$STASH_OUTDIR" \
            "$TMPDIR/reject.module" \
            "$TMPDIR/direct.module" \
            "$TMPDIR/proxy.module"

          grep -q "Upstream:${SOURCE_SHA}" "$MODULE_OUTDIR/gmoogway-proxy-list-ai.module"
          if grep -Eq ',PROXY(,|$)' "$MODULE_OUTDIR/gmoogway-proxy-list-ai.module"; then
            echo "Unconverted PROXY policy detected" >&2
            exit 1
          fi

          for list in reject direct proxy; do
            for behavior in domain ipcidr classical; do
              file="$STASH_OUTDIR/gmoogway-${list}-${behavior}.yaml"
              test -s "$file"
              grep -q '^payload:' "$file"
            done
          done
          if grep -R -n '"URL-REGEX,' "$STASH_OUTDIR"/gmoogway-*-classical.yaml; then
            echo "Unconverted URL-REGEX remains in Stash classical providers" >&2
            exit 1
          fi

          for file in \
            gmoogway-lite-reject-domain.yaml \
            gmoogway-lite-direct-domain.yaml \
            gmoogway-lite-proxy-domain.yaml \
            gmoogway-lite-proxy-ipcidr.yaml; do
            test -s "$STASH_OUTDIR/$file"
            grep -q '^payload:' "$STASH_OUTDIR/$file"
            grep -q "# Excludes: Repcz/Tool@${BASE_SHA}" "$STASH_OUTDIR/$file"
          done
          test -s "$STASH_OUTDIR/gmoogway-lite-report.txt"
          grep -q "base_files=22" "$STASH_OUTDIR/gmoogway-lite-report.txt"

          # Override audit: only four generated delta providers, stable URLs, no classical/path.
          test -s "$LITE_OVERRIDE"
          test "$(grep -Ec '^  gmoogway-lite-(reject-domain|direct-domain|proxy-domain|proxy-ipcidr):$' "$LITE_OVERRIDE")" -eq 4
          if grep -Eq 'behavior: classical|^[[:space:]]+path:|\?rev=' "$LITE_OVERRIDE"; then
            echo "Delta override contains a forbidden classical/path/cache-busting field" >&2
            exit 1
          fi

          python - "$LITE_OVERRIDE" <<'PY'
          from pathlib import Path
          import sys

          rules = [
              line.strip()[2:]
              for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
              if line.strip().startswith("- ")
          ]
          expected = [
              "RULE-SET,Direct,DIRECT",
              "RULE-SET,Reject,REJECT",
              "RULE-SET,gmoogway-lite-reject-domain,REJECT",
              "RULE-SET,gmoogway-lite-direct-domain,DIRECT",
              "RULE-SET,AI,AI",
              "RULE-SET,gmoogway-lite-proxy-domain,Global",
              "RULE-SET,gmoogway-lite-proxy-ipcidr,Global,no-resolve",
          ]
          if rules != expected:
              raise SystemExit(f"Unexpected delta override rule order: {rules!r}")
          PY

          FULL_RULES="$((
            $(sed -n 's/^# Rules: //p' "$STASH_OUTDIR/gmoogway-reject-domain.yaml") +
            $(sed -n 's/^# Rules: //p' "$STASH_OUTDIR/gmoogway-direct-domain.yaml") +
            $(sed -n 's/^# Rules: //p' "$STASH_OUTDIR/gmoogway-proxy-domain.yaml") +
            $(sed -n 's/^# Rules: //p' "$STASH_OUTDIR/gmoogway-proxy-ipcidr.yaml")
          ))"
          LITE_RULES="$((
            $(sed -n 's/^# Rules: //p' "$STASH_OUTDIR/gmoogway-lite-reject-domain.yaml") +
            $(sed -n 's/^# Rules: //p' "$STASH_OUTDIR/gmoogway-lite-direct-domain.yaml") +
            $(sed -n 's/^# Rules: //p' "$STASH_OUTDIR/gmoogway-lite-proxy-domain.yaml") +
            $(sed -n 's/^# Rules: //p' "$STASH_OUTDIR/gmoogway-lite-proxy-ipcidr.yaml")
          ))"
          test "$LITE_RULES" -gt 0
          test "$LITE_RULES" -lt "$FULL_RULES"
          if [ "$LITE_RULES" -ge 300000 ]; then
            echo "Delta Stash rule budget exceeded: ${LITE_RULES} >= 300000" >&2
            exit 1
          fi

          printf 'GMOogway=%s Repcz=%s full=%s delta=%s removed=%s\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$FULL_RULES" "$LITE_RULES" "$((FULL_RULES-LITE_RULES))"

      - name: Commit and push if changed
        run: |
          git config user.name "Dream230-1"
          git config user.email "174472357+Dream230-1@users.noreply.github.com"
          git add \
            LOWERTOP-Enterprise-v3.1/modules/derived/gmoogway-reject-list-daily.module \
            LOWERTOP-Enterprise-v3.1/modules/derived/gmoogway-direct-list-daily.module \
            LOWERTOP-Enterprise-v3.1/modules/derived/gmoogway-proxy-list-ai.module \
            LOWERTOP-Enterprise-v3.1/rules/stash/
          if git diff --cached --quiet; then
            echo "No changes — all Shadowrocket and Stash outputs are unchanged."
          else
            git commit -m "Auto-sync GMOogway delta rules for Stash ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
