module:
  id: icloud
  enabled: true
  description: iCloud 分层分流。普通 iCloud Drive、照片、云备份、CloudKit、Keychain、
   iWork 文档及 Apple Account 认证端点保持 DIRECT；专用代理 mask 端点由更靠前的
   Apple-Global-AI 精确规则交给 AI。该模块只做路由，不启用 HTTPS 解密。
  rulesets:
    - kind: local
      name: Apple-iCloud
      policy: DIRECT
      stage: 35
