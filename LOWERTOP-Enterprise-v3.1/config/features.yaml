features:
  default_profile: performance
  dns_leak_guard: true
  advertising_lite: false
  adblock_collision_audit: false
  ruleset_drift_audit: true
  route_regression: true
  rule_conflict_audit: true
  behavior_lock: true
  modular_build: true
  conditional_remote_cache: true
  service_health_report: true
  network_benchmark_report: true
  scripts_config_validation: true
  optional_module_security_audit: true
  secret_scanning: true

  # v3.1 仅将 Apple 天气作为独立可选模块，不会自动注入主配置。
  apple_weather_qweather_module_available: true
  apple_weather_qweather: false

  ipv6_svcb_experimental: true
  force_ech: false
  unverified_dns_protocol_fallback: false
  dns_dynamic_auto_selection: false
