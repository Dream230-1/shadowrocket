  # Apple Global positive routing and explicit Core exclusion.
  - name: Apple Private Relay mask
    host: mask.icloud.com
    expected_policy: AI
    expected_source_contains: Apple-Global-AI
    forbidden_policies: [DIRECT]
    forbidden_sources: [Apple-Core-Direct]
    requires_remote: false
