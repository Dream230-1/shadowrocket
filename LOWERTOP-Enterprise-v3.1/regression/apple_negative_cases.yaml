  # Lexical and suffix-boundary negatives: must not overmatch Apple modules.
  - name: Apple lexical impostor
    host: notapple.com
    expected_policy: PROXY
    expected_source_contains: FINAL
    forbidden_policies: [AI, DIRECT]
    forbidden_sources: [Apple-Global-AI, Apple-Core-Direct]
    requires_remote: false
